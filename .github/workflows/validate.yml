name: 검증

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Git 개인정보 검사 회귀 검증
        shell: pwsh
        run: ./tools/Test-TrackingPrivacyGuard.ps1
      - name: Git 개인정보 및 로컬 파일 추적 검증
        shell: pwsh
        run: ./tools/Check-NoPhysicalDeviceIdentifiers.ps1
      - name: 셔틀 CSV 계약 검증
        run: bash ./gradlew :data-pipeline:run --args="publish-shuttle $GITHUB_WORKSPACE/data-source/shuttle.csv $RUNNER_TEMP/site"
      - name: JVM·파이프라인·Android 검증
        run: bash ./gradlew testDebugUnitTest :data-pipeline:test compileDebugAndroidTestKotlin lintDebug assembleOptimized
      - name: 익명 기숙사 식단 업로드 계약 검증
        run: node --test
        working-directory: anonymous-upload-worker
