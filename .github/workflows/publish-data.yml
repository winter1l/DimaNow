name: 캠퍼스 데이터 게시

on:
  repository_dispatch:
    # dorm-submission: sent by the upload Worker after it writes a photo to dorm-submissions. Only the event type
    # selects the dormitory sweep; client_payload is never read, and the schedule remains the fallback.
    # dorm-report-*: an anonymous report of the published dormitory week; the reason is the event type itself, so
    # no client_payload is read here either.
    types: [student-meal-publication-watch, dorm-submission, dorm-report-wrong-menu, dorm-report-not-dormitory, dorm-report-offensive, dorm-report-other]
  release:
    # app_release: the in-app updater reads the latest stable release from Pages (D-099 clause 8).
    types: [published, edited, deleted, released, unpublished]
  push:
    branches: [main, dorm-submissions]
    paths:
      - data-source/shuttle.csv
      - data-source/calendar.json
      - pages/**
      - PRIVACY.md
      - tools/render_privacy_page.py
      - data-pipeline/**
      - sync-contract/**
      - dorm-submissions/**
      - .github/workflows/publish-data.yml
  schedule:
    # UTC: Monday 09:07-13:37 KST every 30m; then every 2h until the week is published.
    # Offset from the hour to avoid the busiest scheduler slots. Already-published weeks skip OCR.
    - cron: "7,37 0-4 * * 1"
    - cron: "7 5-23/2 * * 1"
    - cron: "7 1-23/2 * * 0,2-6"
    - cron: "43 0 * * *"
  workflow_dispatch:
    inputs:
      dataset:
        description: 게시할 데이터
        required: true
        default: all
        type: choice
        options: [all, shuttle, meal, notice, dorm, release, dorm-revoke, deploy-only]

permissions:
  contents: write
  pages: write
  id-token: write
  # Only the final status step uses it, to open or update one "데이터 게시 확인 필요" issue for the owner.
  issues: write

concurrency:
  group: dima-now-data-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Credentials are not persisted in source/.git: build scripts, Gradle plugins and pipeline code never see the
      # write token. Only the final data-branch push receives it explicitly.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: 기존 data 브랜치 준비
        shell: bash
        run: |
          if git -C source fetch origin data:refs/remotes/origin/data; then
            git -C source worktree add "$GITHUB_WORKSPACE/site" refs/remotes/origin/data
          else
            git -C source worktree add --detach "$GITHUB_WORKSPACE/site"
            git -C site checkout --orphan data
            git -C site rm -rf .
          fi
          touch site/.nojekyll
      - name: 실행 데이터셋 결정
        id: target
        shell: bash
        env:
          REQUESTED: ${{ inputs.dataset }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TYPE: ${{ github.event.action }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "dorm-submissions" ]]; then value=dorm
          elif [[ "$EVENT_NAME" == "push" ]]; then value=shuttle
          elif [[ "$EVENT_NAME" == "release" ]]; then value=release
          elif [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            case "$DISPATCH_TYPE" in
              dorm-submission) value=dorm ;;
              student-meal-publication-watch) value=meal ;;
              dorm-report-wrong-menu|dorm-report-not-dormitory|dorm-report-offensive|dorm-report-other) value=dorm-report ;;
              *) echo "지원하지 않는 repository_dispatch 유형입니다." >&2; exit 1 ;;
            esac
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$REQUESTED" in
              all|shuttle|meal|notice|dorm|release|dorm-revoke|deploy-only) value="$REQUESTED" ;;
              *) echo "지원하지 않는 수동 게시 대상입니다." >&2; exit 1 ;;
            esac
          elif [[ "$SCHEDULE_EXPRESSION" == "43 0 * * *" ]]; then value=notice
          else value=meal
          fi
          # The shared concurrency group replaces a pending run with a newer one, so the dormitory backlog is swept
          # on dorm pushes and dispatches, full manual runs and every scheduled run instead of trusting one run per
          # submission.
          dorm=false
          case "$value" in dorm|all) dorm=true ;; esac
          # The latest release is re-read on release events, full runs and the daily notice run.
          release=false
          case "$value" in release|all|notice) release=true ;; esac
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "schedule" ]]; then dorm=true; fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "dorm=$dorm" >> "$GITHUB_OUTPUT"
      - name: 셔틀 게시
        if: steps.target.outputs.value == 'shuttle' || steps.target.outputs.value == 'all'
        working-directory: source
        run: |
          bash ./gradlew :data-pipeline:run --args="publish-shuttle $GITHUB_WORKSPACE/source/data-source/shuttle.csv $GITHUB_WORKSPACE/site"
          bash ./gradlew :data-pipeline:run --args="publish-calendar $GITHUB_WORKSPACE/source/data-source/calendar.json $GITHUB_WORKSPACE/site"
      - name: 최신 릴리스 읽기
        id: latest_release
        if: steps.target.outputs.release == 'true'
        shell: bash
        # Public data, read without a token so no step that runs build or pipeline code ever holds one.
        run: |
          set -uo pipefail
          if curl -fsSL --max-time 30 -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" -o "$RUNNER_TEMP/latest-release.json"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "최신 안정 릴리스가 없어 앱 릴리스 정보를 건너뜁니다."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 앱 릴리스 정보 게시
        if: steps.latest_release.outputs.found == 'true'
        working-directory: source
        run: bash ./gradlew :data-pipeline:run --args="publish-app-release $RUNNER_TEMP/latest-release.json $GITHUB_WORKSPACE/site"
      - name: 식단 게시
        if: steps.target.outputs.value == 'meal' || steps.target.outputs.value == 'all'
        working-directory: source
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          command=publish-meal
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "repository_dispatch" ]]; then command=collect-meal; fi
          bash ./gradlew :data-pipeline:run --args="$command ignored $GITHUB_WORKSPACE/site"
      - name: 기숙사 대기 제출 목록
        id: dorm_pending
        if: steps.target.outputs.dorm == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Every image on dorm-submissions without a published status, oldest commit first, at most 10 per run.
          # Images are read as regular-file blobs from Git objects; the branch is never checked out, so its files,
          # symlinks and older workflow code are neither executed nor followed.
          ref=refs/remotes/origin/dorm-submissions
          root="$RUNNER_TEMP/dorm-pending"
          index="$RUNNER_TEMP/dorm-pending.txt"
          candidates="$RUNNER_TEMP/dorm-candidates.txt"
          mkdir -p "$root/dorm-submissions"
          : > "$index"
          : > "$candidates"
          if ! git -C source fetch --no-tags origin "+refs/heads/dorm-submissions:$ref"; then
            echo "dorm-submissions 브랜치가 없어 기숙사 제출 처리를 건너뜁니다."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS=$'\t' read -r meta path; do
            read -r mode type _ <<< "$meta"
            [[ "$mode" == 100644 && "$type" == blob ]] || continue
            [[ "$path" =~ ^dorm-submissions/[A-Za-z0-9_-]{1,64}\.(jpg|jpeg|png|webp)$ ]] || continue
            file="${path#dorm-submissions/}"
            [[ -e "site/data/v1/dorm-submissions/${file%.*}.json" ]] && continue
            commit="$(git -C source log -1 --format='%H %ct' "$ref" -- "$path")"
            [[ "$commit" =~ ^[0-9a-f]{40}\ [0-9]{1,12}$ ]] || continue
            echo "$commit $path" >> "$candidates"
          done < <(git -C source ls-tree -r --full-tree "$ref" -- dorm-submissions/)
          sort -k2,2n -k1,1 -k3,3 -o "$candidates" "$candidates"
          head -n 10 "$candidates" > "$index"
          while read -r _ _ path; do
            git -C source cat-file blob "$ref:$path" > "$root/$path"
          done < "$index"
          count="$(wc -l < "$index" | tr -d ' ')"
          echo "기숙사 대기 제출 ${count}건"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: 기숙사 식단 검증 및 자동 게시
        if: steps.target.outputs.dorm == 'true' && steps.dorm_pending.outputs.count != '0'
        working-directory: source
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash ./gradlew :data-pipeline:run --args="publish-dorm-pending $RUNNER_TEMP/dorm-pending $GITHUB_WORKSPACE/site $RUNNER_TEMP/dorm-pending.txt"
      - name: 공지 게시
        if: steps.target.outputs.value == 'notice' || steps.target.outputs.value == 'all'
        working-directory: source
        run: bash ./gradlew :data-pipeline:run --args="publish-notice ignored $GITHUB_WORKSPACE/site"
      - name: 기숙사 식단 내리기
        # Owner-only manual action after reviewing a report: the current dormitory week stops being published and
        # apps drop it, so a new photo can be uploaded. The photo itself stays in dorm-submissions history.
        if: steps.target.outputs.value == 'dorm-revoke'
        working-directory: source
        run: bash ./gradlew :data-pipeline:run --args="revoke-dorm-meal ignored $GITHUB_WORKSPACE/site"
      - name: 안내 페이지 복사
        shell: bash
        # pages/ in main holds the download and install page; privacy.html is rendered from PRIVACY.md so the
        # Markdown file stays the only copy of the policy.
        run: |
          cp -R source/pages/. site/
          python3 source/tools/render_privacy_page.py source/PRIVACY.md site/privacy.html
      - name: 생성 데이터 커밋
        id: generated
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.value }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git -C site config user.name github-actions[bot]
          git -C site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C site add -- .
          if ! git -C site diff --cached --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git -C site commit -m "data: publish $TARGET"
            # The only credentialed Git operation: the token reaches git through process-scoped config for this
            # push and is never written to .git/config.
            basic="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            echo "::add-mask::$basic"
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" \
              git -C site push origin HEAD:data
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f site/.git
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        if: steps.generated.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
      - name: Pages 아티팩트 생성
        if: steps.generated.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          tar \
            --dereference --hard-dereference \
            --directory site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - name: Pages 아티팩트 업로드
        if: steps.generated.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Pages 배포
        if: steps.generated.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: 신고와 게시 상태 알림
        # The only other step with a token: it runs nothing but the gh CLI on fixed text to open, update or close
        # owner issues. Event type and manifest states are the only inputs; no client payload is read.
        if: always()
        shell: bash
        env:
          ISSUE_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          DISPATCH_TYPE: ${{ github.event.action }}
          TARGET: ${{ steps.target.outputs.value }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          export GH_TOKEN="$ISSUE_TOKEN"
          repo="$GITHUB_REPOSITORY"
          manifest="site/data/v1/manifest.json"
          if [[ "$TARGET" == "dorm-report" ]]; then
            case "$DISPATCH_TYPE" in
              dorm-report-wrong-menu) label="메뉴가 사진이나 실제와 달라요" ;;
              dorm-report-not-dormitory) label="기숙사 식단이 아니에요" ;;
              dorm-report-offensive) label="부적절한 내용이 있어요" ;;
              *) label="기타" ;;
            esac
            week="$(jq -r '.datasets.dorm_meal.publishedAt // "알 수 없음"' "$manifest" 2>/dev/null || echo "알 수 없음")"
            title="기숙사 식단 신고"
            existing="$(gh issue list --repo "$repo" --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" --repo "$repo" --body "추가 신고: $label (게시 시각 $week)"
            else
              {
                echo "익명 신고: $label"
                echo "신고된 식단의 게시 시각: $week"
                echo
                echo "확인 후 내려야 하면 Actions의 '캠퍼스 데이터 게시'를 dorm-revoke로 실행해 주세요."
              } > "$RUNNER_TEMP/report.md"
              gh issue create --repo "$repo" --title "$title" --body-file "$RUNNER_TEMP/report.md"
            fi
          fi
          title="데이터 게시 확인 필요"
          problems_file="$RUNNER_TEMP/publish-problems.md"
          : > "$problems_file"
          if [[ "$JOB_STATUS" != "success" ]]; then echo "- 게시 작업이 실패했어요 ($JOB_STATUS)." >> "$problems_file"; fi
          if [[ -f "$manifest" ]]; then
            # WAITING is the normal "not posted yet" state; NEEDS_REVIEW and ERROR need the owner.
            jq -r '.datasets | to_entries[] | select(.value.state == "NEEDS_REVIEW" or .value.state == "ERROR")
              | "- \(.key): \(.value.state) — \(.value.message // "사유 없음")"' "$manifest" >> "$problems_file"
          fi
          existing="$(gh issue list --repo "$repo" --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          if [[ -s "$problems_file" ]]; then
            { echo; echo "최근 실행: $RUN_URL"; } >> "$problems_file"
            if [[ -n "$existing" ]]; then gh issue edit "$existing" --repo "$repo" --body-file "$problems_file"
            else gh issue create --repo "$repo" --title "$title" --body-file "$problems_file"
            fi
          elif [[ -n "$existing" && "$JOB_STATUS" == "success" ]]; then
            gh issue close "$existing" --repo "$repo" --comment "다음 실행에서 정상으로 돌아왔어요: $RUN_URL"
          fi
