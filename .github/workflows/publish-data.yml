name: 캠퍼스 데이터 게시

on:
  repository_dispatch:
    types: [student-meal-publication-watch]
  push:
    branches: [main, dorm-submissions]
    paths:
      - data-source/shuttle.csv
      - data-pipeline/**
      - sync-contract/**
      - dorm-submissions/**
      - .github/workflows/publish-data.yml
  schedule:
    # UTC: Monday 09:07-13:37 KST every 30m; then every 2h until the week is published.
    # Offset from the hour to avoid the busiest scheduler slots. Already-published weeks skip OCR.
    - cron: "7,37 0-4 * * 1"
    - cron: "7 5-23/2 * * 1"
    - cron: "7 1-23/2 * * 0,2-6"
    - cron: "43 0 * * *"
  workflow_dispatch:
    inputs:
      dataset:
        description: 게시할 데이터
        required: true
        default: all
        type: choice
        options: [all, shuttle, meal, notice, dorm-probe]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dima-now-data-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || inputs.dataset != 'dorm-probe'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          fetch-depth: 0
          ref: main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: github.ref_name == 'dorm-submissions'
        with:
          path: submission
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: 기존 data 브랜치 준비
        shell: bash
        run: |
          if git -C source fetch origin data:refs/remotes/origin/data; then
            git -C source worktree add "$GITHUB_WORKSPACE/site" refs/remotes/origin/data
          else
            git -C source worktree add --detach "$GITHUB_WORKSPACE/site"
            git -C site checkout --orphan data
            git -C site rm -rf .
          fi
          touch site/.nojekyll
      - name: 실행 데이터셋 결정
        id: target
        shell: bash
        env:
          REQUESTED: ${{ inputs.dataset }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == "dorm-submissions" ]]; then value=dorm
          elif [[ "${{ github.event_name }}" == "push" ]]; then value=shuttle
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then value="$REQUESTED"
          elif [[ "$SCHEDULE_EXPRESSION" == "43 0 * * *" ]]; then value=notice
          else value=meal
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: 셔틀 게시
        if: steps.target.outputs.value == 'shuttle' || steps.target.outputs.value == 'all'
        working-directory: source
        run: bash ./gradlew :data-pipeline:run --args="publish-shuttle $GITHUB_WORKSPACE/source/data-source/shuttle.csv $GITHUB_WORKSPACE/site"
      - name: 식단 게시
        if: steps.target.outputs.value == 'meal' || steps.target.outputs.value == 'all'
        working-directory: source
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          command=publish-meal
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "repository_dispatch" ]]; then command=collect-meal; fi
          bash ./gradlew :data-pipeline:run --args="$command ignored $GITHUB_WORKSPACE/site"
      - name: 기숙사 제출 확인
        id: dorm_submission
        if: steps.target.outputs.value == 'dorm'
        shell: bash
        run: |
          path="$(git -C submission diff-tree --no-commit-id --name-only -r HEAD | grep -E '^dorm-submissions/[A-Za-z0-9_-]{1,64}\.(jpg|jpeg|png|webp)$' | head -n 1)"
          [[ -n "$path" ]] || { echo "처리할 기숙사 식단 이미지가 없습니다." >&2; exit 1; }
          file="$(basename "$path")"
          submission_id="${file%.*}"
          extension="${file##*.}"
          case "$extension" in
            jpg|jpeg) mime=image/jpeg ;;
            png) mime=image/png ;;
            webp) mime=image/webp ;;
          esac
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "submission_id=$submission_id" >> "$GITHUB_OUTPUT"
          echo "mime=$mime" >> "$GITHUB_OUTPUT"
          echo "source_url=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/$path" >> "$GITHUB_OUTPUT"
      - name: 기숙사 식단 검증 및 게시
        if: steps.target.outputs.value == 'dorm'
        working-directory: source
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_PATH: ${{ github.workspace }}/submission/${{ steps.dorm_submission.outputs.path }}
          SUBMISSION_ID: ${{ steps.dorm_submission.outputs.submission_id }}
          SOURCE_IMAGE_URL: ${{ steps.dorm_submission.outputs.source_url }}
          MIME_TYPE: ${{ steps.dorm_submission.outputs.mime }}
        run: bash ./gradlew :data-pipeline:run --args="publish-dorm-meal $IMAGE_PATH $GITHUB_WORKSPACE/site $SUBMISSION_ID $SOURCE_IMAGE_URL $MIME_TYPE"
      - name: 공지 게시
        if: steps.target.outputs.value == 'notice' || steps.target.outputs.value == 'all'
        working-directory: source
        run: bash ./gradlew :data-pipeline:run --args="publish-notice ignored $GITHUB_WORKSPACE/site"
      - name: 생성 데이터 커밋
        id: generated
        shell: bash
        run: |
          git -C site config user.name github-actions[bot]
          git -C site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C site add -- .
          if ! git -C site diff --cached --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git -C site commit -m "data: publish ${{ steps.target.outputs.value }}"
            git -C site push origin HEAD:data
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f site/.git
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        if: steps.generated.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
      - name: Pages 아티팩트 생성
        if: steps.generated.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          tar \
            --dereference --hard-dereference \
            --directory site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - name: Pages 아티팩트 업로드
        if: steps.generated.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Pages 배포
        if: steps.generated.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  dorm-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.dataset == 'dorm-probe'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        thinking: [minimal, LOW]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Verify the exact submitted meal image
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dorm-probe"
          curl --fail --proto '=https' --tlsv1.2 --max-time 60 \
            'https://raw.githubusercontent.com/winter1l/DimaNow/80e5a6392c7bdddd2dd74936d508b9b1e0989adb/dorm-submissions/7eeefd2f-32f7-4280-8a33-02890f3b5288.jpg' \
            -o "$RUNNER_TEMP/dorm-probe/source.jpg"
          echo "1bf302cdf9ae27b2d550023ef11a02502dd25771d678272f3e2a7424ec661e17  $RUNNER_TEMP/dorm-probe/source.jpg" | sha256sum --check --strict
      - name: Recognize the image with HIGH media resolution
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_DORM_GEMINI_PROBE: 'true'
          DORM_GEMINI_IMAGE: ${{ runner.temp }}/dorm-probe/source.jpg
          DORM_GEMINI_OUTPUT: ${{ runner.temp }}/dorm-probe/recognition.json
          DORM_GEMINI_REFERENCE_DATE: '2026-09-14'
          DORM_GEMINI_EXTRACTION_THINKING: ${{ matrix.thinking }}
        run: |
          /usr/bin/time -f '{"elapsedSeconds":%e}' -o "$RUNNER_TEMP/dorm-probe/timing.json" \
            bash ./gradlew :data-pipeline:test \
              --tests com.example.dimanow.pipeline.GeminiDormitoryMealClientTest \
              --tests com.example.dimanow.pipeline.DormitoryMealLiveProbeTest \
              --no-daemon
      - name: Save recognition and timing for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dorm-high-${{ matrix.thinking }}
          path: |
            ${{ runner.temp }}/dorm-probe/recognition.json
            ${{ runner.temp }}/dorm-probe/recognition-metrics.json
            ${{ runner.temp }}/dorm-probe/timing.json
            data-pipeline/build/test-results/test
          retention-days: 7
          if-no-files-found: warn
