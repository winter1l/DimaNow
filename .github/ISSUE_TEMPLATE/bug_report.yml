name: 오류 제보·문의
description: 앱이 이상하게 동작하거나 궁금한 점이 있을 때
title: "[제보] "
body:
  - type: markdown
    attributes:
      value: |
        이 게시판은 **누구나 볼 수 있어요.** 학번·비밀번호·시간표·정확한 위치·전화번호·사진 속 개인정보는 적지 말아 주세요.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      description: 어느 화면에서 무엇을 했을 때 어떻게 됐는지 적어 주세요.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 앱 버전
      description: 설정 → 앱 업데이트에 보이는 버전
  - type: input
    id: device
    attributes:
      label: 휴대폰 기종과 Android 버전
      placeholder: 예) 갤럭시 S24, Android 16
