name: 계측 테스트

# Runs the full :app androidTest suite on an API 36 emulator so stale instrumentation
# assertions fail CI instead of hiding behind the JVM-only validate workflow.
on:
  push:
    branches: [main]
    paths:
      - app/**
      - sync-contract/**
      - gradle/**
      - "*.gradle.kts"
      - gradle.properties
      - .github/scripts/instrumentation-shard.sh
      - .github/workflows/instrumentation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected:
    name: 계측 테스트 (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    # The emulator stays on API 36: LiveSurfacePresentationTest reads
    # Notification.shortCriticalText, which does not exist before API 36.
    # The pixel_6 profile (1080x2400, 420 dpi) matches the local medium_phone AVD. Without a
    # profile avdmanager creates a 320x640 screen, so layouts and captures differed from local
    # runs. force-avd-creation is false, so a profile change must also change the AVD cache key,
    # or a cached AVD keeps its old screen.
    env:
      SHARD_COUNT: "2"
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: KVM 활성화
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: 앱·테스트 APK 빌드
        # Compile failures stop here, before an emulator is booted.
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: AVD 캐시
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api36-google_apis-x86_64-pixel_6-ram4096-v2
      - name: AVD 스냅샷 생성
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated for caching."
      - name: connectedDebugAndroidTest
        id: tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/instrumentation-shard.sh
      - name: 계측 테스트 보고서 업로드
        if: failure() || steps.tests.outputs.rerun == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instrumentation-reports-shard-${{ matrix.shard }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/androidTest-attempts/
          retention-days: 14
          if-no-files-found: warn
